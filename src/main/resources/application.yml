spring:
  application:
    name: gym-crm-spring-boot
  profiles:
    active: dev

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:liquibase/changelog-master.yml
    enabled: true

security:
  password:
    chars: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789
    length: 10
    bcrypt-strength: 12
  cors:
    # is empty as there is no frontend application.
    allowed-origins: []
    allowed-methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
    allowed-headers: [Authorization, Content-Type, X-Requested-With]
    allow-credentials: false
    max-age-seconds: 3600
  jwt:
    cookie-name: JWT_TOKEN
    secret: ${JWT_SECRET_KEY:d3f7a1b4c9e8f2a6b5d0e3f1c4a7b9e2d6f8a3b5c7e1f4a9b2d0e3f6c8a1b4d7}
    expiration-ms: 3600000

eureka:
 client:
   register-with-eureka: true
   fetch-registry: true
   service-url:
     defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
 instance:
   prefer-ip-address: true

workload:
 service:
   name: ${WORKLOAD_SERVICE_NAME:trainer-workload-service}

resilience4j:
 circuit-breaker:
   instances:
     workloadServiceCircuitBreaker:
       sliding-window-type: COUNT_BASED
       sliding-window-size: 20
       minimum-number-of-calls: 10
       permitted-number-of-calls-in-half-open-state: 3
       wait-duration-in-open-state: 30s
       failure-rate-threshold: 50
       automatic-transition-from-open-to-half-open-enabled: true
       ignore-exceptions:
         - "feign.FeignException$BadRequest"
         - "feign.FeignException$FeignClientException"

logging:
 level:
   liquibase: info

health:
  inactive-trainer:
    threshold-days: 3

management:
  endpoint:
    health:
      show-details: always
      status:
        http-mapping:
          down: 503
          out-of-service: 503
          unknown: 200
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5443/gymcrm_local
    username: ${DB_LOCAL_USERNAME:postgres}
    password: ${DB_LOCAL_PASSWORD:localSecretPwd123}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5444/gymcrm_dev
    username: ${DB_DEV_USERNAME:postgres}
    password: ${DB_DEV_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: stg

  datasource:
    url: jdbc:postgresql://localhost:5445/gymcrm_stg
    username: ${DB_STG_USERNAME:postgres}
    password: ${DB_STG_PASSWORD}

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://localhost:5446/gymcrm_prod
    username: ${DB_PROD_USERNAME:postgres}
    password: ${DB_PROD_PASSWORD}
